<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Micro-Framework SASS</title>
  <!-- Archivo CSS generado tras compilar main.scss -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <header>
    <h1>Micro-Framework SASS - Demostración</h1>
    <p>Interfaz de componentes modularizados compilada desde SASS.</p>
  </header>

  <main>
    <article class="card-demo">
      <header>
        <h2>Botones de la Paleta Corporativa</h2>
        <p>Generados mediante bucles <code>@each</code> y mezcla de accesibilidad con <code>@if / @else</code>:</p>
      </header>
      
      <!-- Navegación de botones utilitarios -->
      <nav class="acciones">
        <button type="button" class="btn btn-primario">Botón Primario</button>
        <button type="button" class="btn btn-secundario">Botón Secundario</button>
        <button type="button" class="btn btn-acento">Botón Acento</button>
        <button type="button" class="btn btn-peligro">Botón Peligro</button>
        <button type="button" class="btn btn-advertencia">Botón Advertencia</button>
      </nav>
    </article>
  </main>

  <footer>
    <small>&copy; 2026 Desarrollo de Aplicaciones - Micro-Framework SASS</small>
  </footer>

</body>
</html>
